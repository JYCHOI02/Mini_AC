<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚫 접근 권한 없음 (403 Forbidden)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

  <!-- 공통 헤더 네비게이션 -->
  {% include 'partials/_nav.html' %}

  <!-- 메인 컨테이너 -->
  <main class="flex-1 flex items-center justify-center px-4 py-16">
    <div class="w-full max-w-md text-center">

      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        <div class="w-16 h-16 bg-rose-50 text-rose-600 rounded-2xl flex items-center justify-center mx-auto text-3xl mb-4 shadow-inner">
          🚫
        </div>
        
        <h1 class="text-2xl font-bold text-gray-900 mb-2">접근 권한이 없습니다</h1>
        <div class="text-xs font-mono text-rose-500 font-semibold mb-4">403 FORBIDDEN</div>

        <div class="p-4 bg-gray-50 rounded-xl text-sm text-gray-600 mb-6 leading-relaxed">
          {% if reason %}
            <p>{{ reason }}</p>
          {% else %}
            <p>이 페이지는 <strong class="text-rose-600">[{{ required_role }}]</strong> 등급 이상만 접근할 수 있습니다.</p>
            <p class="text-xs text-gray-400 mt-1">현재 내 권한: <span class="font-semibold text-gray-700">{{ current_role }}</span></p>
          {% endif %}
        </div>

        <div class="space-y-2">
          <a href="{{ url_for('auth.login') }}" class="w-full inline-block bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-sm">
            다른 계정으로 로그인하기
          </a>
          <a href="/" class="w-full inline-block bg-white hover:bg-gray-50 text-gray-700 border border-gray-200 font-semibold py-2.5 rounded-xl text-sm transition">
            메인 게시판으로 돌아가기
          </a>
        </div>
      </div>

    </div>
  </main>

</body>
</html>
