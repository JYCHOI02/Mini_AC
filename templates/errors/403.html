<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>접근 제한 (403)</title>
</head>
<body style="text-align: center; padding-top: 50px; font-family: sans-serif;">
  <h1 style="color: red;">🚫 접근 권한이 없습니다 (403 Forbidden)</h1>
  {% if reason %}
    <p>{{ reason }}</p>
  {% else %}
    <p>이 페이지는 <strong>[{{ required_role }}]</strong> 이상만 접근할 수 있습니다.</p>
    <p>현재 내 권한: <strong>{{ current_role }}</strong></p>
  {% endif %}
  <br>
  <a href="/">메인으로 돌아가기</a>
</body>
</html>
