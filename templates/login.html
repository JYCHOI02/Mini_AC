<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 — 모던 게시판</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

  <!-- 공통 헤더 네비게이션 -->
  {% include 'partials/_nav.html' %}

  <!-- 메인 컨테이너 -->
  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">

      <!-- 권한 부족 / 안내 플래시 메시지 배너 -->
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="mb-6 space-y-3">
            {% for message in messages %}
              <div class="p-4 bg-rose-50 border border-rose-200 text-rose-800 rounded-2xl flex items-start gap-3 shadow-sm animate-fade-in">
                <div class="p-1 bg-rose-100 rounded-lg text-rose-600 shrink-0 mt-0.5">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                  </svg>
                </div>
                <div>
                  <h4 class="text-sm font-bold text-rose-900">접근 권한 필요</h4>
                  <p class="text-xs text-rose-700 mt-0.5 leading-relaxed">{{ message }}</p>
                </div>
              </div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <!-- 로그인 카드 -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        <!-- 카드 헤더 -->
        <div class="text-center mb-8">
          <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 text-2xl mb-3 shadow-inner">
            🔑
          </div>
          <h1 class="text-2xl font-bold text-gray-900">로그인</h1>
          <p class="text-sm text-gray-500 mt-1">계정 정보를 입력하여 서비스를 이용해 주세요.</p>
        </div>

        <!-- 로그인 폼 -->
        <form id="login-form" onsubmit="handleFormLogin(event)" class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5" for="login-username">아이디</label>
            <input type="text" id="login-username" required placeholder="아이디를 입력하세요"
                   class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition bg-gray-50/30">
          </div>

          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="block text-sm font-semibold text-gray-700" for="login-password">비밀번호</label>
            </div>
            <input type="password" id="login-password" required placeholder="비밀번호를 입력하세요"
                   class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition bg-gray-50/30">
          </div>

          <button type="submit" id="submit-btn"
                  class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-sm hover:shadow flex items-center justify-center gap-2 mt-2">
            <span>로그인하기</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
            </svg>
          </button>
        </form>

        <!-- 카드 푸터 링크 -->
        <div class="mt-8 pt-6 border-t border-gray-100 flex flex-col sm:flex-row items-center justify-between text-xs text-gray-500 gap-2">
          <span>아직 회원이 아니신가요?</span>
          <a href="{{ url_for('auth.register') }}" class="font-semibold text-indigo-600 hover:text-indigo-700 hover:underline">
            새 계정 회원가입 →
          </a>
        </div>
      </div>

      <!-- 뒤로가기 링크 -->
      <div class="text-center mt-6">
        <a href="/" class="text-xs text-gray-500 hover:text-gray-700 transition inline-flex items-center gap-1">
          ← 메인 게시판으로 돌아가기
        </a>
      </div>

    </div>
  </main>

  <script>
    // 로그인 화면 진입 시 브라우저 잔여 인증 정보 초기화
    localStorage.removeItem('token');
    localStorage.removeItem('username');
    localStorage.removeItem('role');

    async function handleFormLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;

      if (!username || !password) {
        alert('아이디와 비밀번호를 모두 입력해 주세요.');
        return;
      }

      btn.disabled = true;
      btn.classList.add('opacity-75', 'cursor-not-allowed');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username, password})
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('token', data.access_token || 'authenticated');
          localStorage.setItem('username', data.username);
          localStorage.setItem('role', data.role);
          
          // 로그인 성공 시 역할(role)에 따른 분기 이동
          if (data.role === 2) {
            window.location.href = '{{ url_for("cafe.admin_page") }}';
          } else if (data.role === 1) {
            window.location.href = '{{ url_for("cafe.gold_page") }}';
          } else {
            window.location.href = '/';
          }
        } else {
          alert(data.message || '로그인에 실패했습니다.');
        }
      } catch (err) {
        console.error('로그인 에러:', err);
        alert('서버와 통신 중 오류가 발생했습니다.');
      } finally {
        btn.disabled = false;
        btn.classList.remove('opacity-75', 'cursor-not-allowed');
      }
    }
  </script>

</body>
</html>
